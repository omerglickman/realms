<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realms, Kings and Other Stuff</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">
      <div class="hud-title">Realms, Kings and Other Stuff <span class="hud-build">Phase 0 skeleton</span></div>
      <div class="hud-row">
        <label>Seed <input id="seed" type="text" value="vinral" size="10" /></label>
        <button id="random" title="Pick a random seed and generate">Random</button>
        <label>Size
          <select id="size">
            <option value="160x100" selected>160 × 100 (test map)</option>
            <option value="80x50">80 × 50 (small)</option>
            <option value="400x250">400 × 250 (engine max)</option>
          </select>
        </label>
      </div>
      <div class="hud-row">
        <label>Continents
          <select id="continents">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label>Islands <input id="islands" type="number" min="0" max="20" value="6" style="width:3em" /></label>
        <label>Land <input id="land" type="range" min="25" max="70" value="45" style="width:6em" /> <span id="land-val">45%</span></label>
        <button id="generate">Generate draft</button>
        <button id="testmap" title="Reload the shipped test map">Test map</button>
      </div>
      <div class="hud-row hud-info">
        <span id="info-map"></span>
      </div>
      <div class="hud-row hud-info">
        <span id="info-hex">Hover a hex</span>
      </div>
      <div class="hud-row hud-info hud-dim">
        <span id="info-perf"></span>
      </div>
      <div class="hud-row hud-help hud-dim">Drag to pan · wheel to zoom · arrow keys to scroll · G toggles grid</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
